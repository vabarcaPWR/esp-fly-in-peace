# Ceedling project configuration — esp-fly-in-peace
# Host-side unit tests for firmware business logic
# Ceedling 1.0.x compatible

:project:
  :use_exceptions: false
  :use_test_preprocessor: :all
  :use_auxiliary_dependencies: true
  :build_root: build
  :release_build: false
  :test_file_prefix: test_
  :which_ceedling: gem
  :ceedling_version: 1.0.1

:environment: []

:extension:
  :executable: .out

:paths:
  :test:
    - +:test/**
    - -:support
  :source:
    - ../components/*/src
    - ../components/*/src/*
    - ../components/*/src/*/src
    - ../components/sensors/src
    - ../components/sensors/src/*/src
    - ../main

  :include:
    - ../components/*/inc
    - ../components/*/src
    - ../components/*/src/*
    - ../components/*/src/*/inc
    - ../components/sensors/src/*/inc
    - ../components/sensors/src/*/src
    - ../main
  :support:
    - support

:files:
  :source:
    - ../components/lk8ex1/src/lk8ex1.c
    - ../components/lk8ex1/src/lk8ex1_model.c
    - ../components/lk8ex1/src/lk8ex1_hardware.c

:defines:
  :common: &common_defines
    - CONFIG_SENSOR_MS5611
    - CONFIG_SENSOR_BMP390
    - CONFIG_IMU_MPU6050
    - CONFIG_SOUND_PIEZO
  :test:
    - *common_defines
  :test_preprocess:
    - *common_defines

:cmock:
  :mock_prefix: mock_
  :when_no_prototypes: :warn
  :enforce_strict_ordering: true
  :plugins:
    - :ignore
    - :callback
    - :return_thru_ptr
  :treat_as:
    uint8:    HEX8
    uint16:   HEX16
    uint32:   UINT32
    int8:     INT8
    int32:    INT32
    bool:     UINT8

:unity:
  :defines:
    - UNITY_INCLUDE_DOUBLE
    - UNITY_INCLUDE_FLOAT

:flags:
  :test:
    :compile:
      :*:
        - -Wall
        - -Wextra
        - -Wno-unused-parameter
        - -std=c11

:libraries:
  :test:
    - m

:plugins:
  :enabled:
    - report_tests_pretty_stdout
    - module_generator
