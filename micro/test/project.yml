# Ceedling project configuration — esp-fly-in-peace
# Host-side unit tests for firmware business logic
# Ceedling 1.0.x compatible

:project:
  :use_exceptions: false
  :use_test_preprocessor: :all
  :use_auxiliary_dependencies: true
  :build_root: build
  :release_build: false
  :test_file_prefix: test_
  :which_ceedling: gem
  :ceedling_version: 1.0.1

:environment: []

:extension:
  :executable: .out

:paths:
  :test:
    - +:test/**
    - -:support
  :source:
    - ../components/*/src/**
  :include:
    - ../components/*/include/**
  :support:
    - support
    - support/mocks

:defines:
  :common: &common_defines []
  :test:
    - *common_defines
    - TEST
  :test_preprocess:
    - *common_defines
    - TEST

:cmock:
  :mock_prefix: mock_
  :when_no_prototypes: :warn
  :enforce_strict_ordering: true
  :plugins:
    - :ignore
    - :callback
    - :return_thru_ptr
  :treat_as:
    uint8:    HEX8
    uint16:   HEX16
    uint32:   UINT32
    int8:     INT8
    int32:    INT32
    bool:     UINT8

:unity:
  :defines:
    - UNITY_INCLUDE_DOUBLE
    - UNITY_INCLUDE_FLOAT

:flags:
  :test:
    :compile:
      :*:
        - -Wall
        - -Wextra
        - -Wno-unused-parameter
        - -std=c11

:plugins:
  :enabled:
    - report_tests_pretty_stdout
    - module_generator
